<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BLAKE3 Minimal Example</title>
</head>
<body>
  <h1>BLAKE3 Minimal Browser Example</h1>
  <input type="file" id="file">
  <pre id="output">Select a file to hash...</pre>

  <!--
    ============================================================
    MINIMAL BLAKE3 WASM USAGE - COPY THIS INTO YOUR PROJECT
    ============================================================

    REQUIREMENTS:
    1. SharedArrayBuffer support (needs COOP/COEP headers)
    2. WASM files in: blake3-wasm-rayon/pkg/

    TO SERVE LOCALLY WITH REQUIRED HEADERS:
      npx serve --cors -l 8080

    OR ADD THESE HEADERS TO YOUR SERVER:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Embedder-Policy: require-corp

    WASM FILES NEEDED:
      blake3-wasm-rayon/pkg/blake3_wasm_rayon.js
      blake3-wasm-rayon/pkg/blake3_wasm_rayon_bg.wasm
      blake3-wasm-rayon/pkg/snippets/.../workerHelpers.js
    ============================================================
  -->
  <script type="module">
    // ============================================================
    // STEP 1: Load and initialize WASM module
    // ============================================================

    // Import the WASM JavaScript bindings
    const blake3 = await import('./blake3-wasm-rayon/pkg/blake3_wasm_rayon.js');

    // Fetch the WASM binary
    const wasmResponse = await fetch('./blake3-wasm-rayon/pkg/blake3_wasm_rayon_bg.wasm');
    const wasmBytes = await wasmResponse.arrayBuffer();

    // Compile and instantiate WASM
    const wasmModule = await WebAssembly.compile(wasmBytes);
    await blake3.default({ module_or_path: wasmModule });

    // Initialize thread pool (4 workers, hard-coded)
    await blake3.initThreadPool(4);

    console.log('BLAKE3 ready!');

    // ============================================================
    // STEP 2: Hash data
    // ============================================================
    //
    // The hash function takes a Uint8Array and returns a Uint8Array (32 bytes)
    //
    // Example:
    //   const data = new Uint8Array([1, 2, 3, 4, 5]);
    //   const hash = blake3.hash(data);  // Returns 32-byte Uint8Array
    //
    // ============================================================

    // ============================================================
    // STEP 3: Example - hash a file
    // ============================================================

    document.getElementById('file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Read file as bytes
      const data = new Uint8Array(await file.arrayBuffer());

      // Hash with BLAKE3
      const start = performance.now();
      const hash = blake3.hash(data);
      const elapsed = performance.now() - start;

      // Convert to hex
      const hex = Array.from(hash).map(b => b.toString(16).padStart(2, '0')).join('');

      // Display result
      const sizeMB = file.size / 1024 / 1024;
      const speed = sizeMB / (elapsed / 1000);

      document.getElementById('output').textContent =
        `File: ${file.name}\n` +
        `Size: ${sizeMB.toFixed(2)} MB\n` +
        `Hash: ${hex}\n` +
        `Time: ${elapsed.toFixed(2)} ms\n` +
        `Speed: ${speed.toFixed(0)} MB/s`;
    });
  </script>
</body>
</html>
