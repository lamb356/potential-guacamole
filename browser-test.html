<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLAKE3 vs SHA-256 Browser Benchmark</title>
  <!-- Enable SharedArrayBuffer on GitHub Pages -->
  <script src="https://cdn.jsdelivr.net/npm/coi-serviceworker@0.1.7/coi-serviceworker.min.js"></script>
  <style>
    /* Minimal CSS for readability */
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 30px; }

    /* File input area */
    .file-area {
      border: 2px dashed #444;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .file-area:hover { border-color: #666; }
    .file-area.dragover { border-color: #4a9eff; background: #1a2a3e; }
    .file-area input { display: none; }
    .file-area button {
      background: #4a9eff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Results grid - side by side comparison */
    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    @media (max-width: 600px) {
      .results { grid-template-columns: 1fr; }
    }

    .result-card {
      background: #252540;
      border-radius: 8px;
      padding: 20px;
    }
    .result-card h3 {
      margin: 0 0 15px 0;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }
    .result-card.blake3 h3 { color: #4ade80; }
    .result-card.sha256 h3 { color: #a78bfa; }

    .stat { margin: 10px 0; }
    .stat-label { color: #888; font-size: 14px; }
    .stat-value { font-family: monospace; font-size: 14px; word-break: break-all; }
    .stat-value.big { font-size: 24px; font-weight: bold; }

    .winner { background: #1a3a1a !important; }
    .error { color: #f87171; }
    .loading { color: #888; }
  </style>
</head>
<body>
  <h1>BLAKE3 vs SHA-256</h1>
  <p class="subtitle">Browser Benchmark - Drop a file to compare</p>

  <!-- File input (supports both drag-drop and click) -->
  <div class="file-area" id="file-area">
    <p>Drop a file here</p>
    <p style="color: #666">or</p>
    <button type="button">Choose File</button>
    <input type="file" id="file-input">
  </div>

  <!-- Side-by-side results -->
  <div class="results" id="results" style="display: none;">
    <!-- BLAKE3 Result -->
    <div class="result-card blake3" id="blake3-card">
      <h3>WASM BLAKE3 (4 threads)</h3>
      <div class="stat">
        <div class="stat-label">Throughput</div>
        <div class="stat-value big" id="blake3-speed">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="blake3-time">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Hash (hex)</div>
        <div class="stat-value" id="blake3-hash">-</div>
      </div>
    </div>

    <!-- SHA-256 Result -->
    <div class="result-card sha256" id="sha256-card">
      <h3>WebCrypto SHA-256</h3>
      <div class="stat">
        <div class="stat-label">Throughput</div>
        <div class="stat-value big" id="sha256-speed">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="sha256-time">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Hash (hex)</div>
        <div class="stat-value" id="sha256-hash">-</div>
      </div>
    </div>
  </div>

  <p id="status" class="loading" style="text-align: center; margin-top: 20px;">
    Loading WASM module...
  </p>

  <!--
    ============================================================
    BLAKE3 WASM BROWSER IMPLEMENTATION
    ============================================================

    This code demonstrates using WASM BLAKE3 with parallel hashing
    in the browser. Key points:

    1. Requires SharedArrayBuffer (needs COOP/COEP headers)
    2. Uses 4 Web Workers for parallel hashing
    3. Hard-coded settings for easy auditing

    Dependencies:
    - blake3-wasm-rayon/pkg/blake3_wasm_rayon.js
    - blake3-wasm-rayon/pkg/blake3_wasm_rayon_bg.wasm
    ============================================================
  -->
  <script type="module">
    // ============================================================
    // CONFIGURATION (hard-coded for simplicity and auditability)
    // ============================================================
    const THREAD_COUNT = 4;  // Fixed number of Web Workers

    // ============================================================
    // GLOBAL STATE
    // ============================================================
    let blake3Module = null;  // WASM module reference
    let isReady = false;      // Initialization complete flag

    // ============================================================
    // INITIALIZATION
    // ============================================================
    async function init() {
      const status = document.getElementById('status');

      // Check for SharedArrayBuffer (required for parallel WASM)
      if (typeof SharedArrayBuffer === 'undefined') {
        status.innerHTML = `
          <span class="error">
            SharedArrayBuffer not available.<br>
            Serve with COOP/COEP headers or use HTTPS.
          </span>
        `;
        return;
      }

      try {
        // Load the WASM module
        blake3Module = await import('./blake3-wasm-rayon/pkg/blake3_wasm_rayon.js');

        // Fetch and compile WASM binary
        const wasmResponse = await fetch('./blake3-wasm-rayon/pkg/blake3_wasm_rayon_bg.wasm');
        const wasmBytes = await wasmResponse.arrayBuffer();
        const wasmModule = await WebAssembly.compile(wasmBytes);

        // Initialize WASM with compiled module
        await blake3Module.default({ module_or_path: wasmModule });

        // Initialize thread pool with fixed thread count
        await blake3Module.initThreadPool(THREAD_COUNT);

        isReady = true;
        status.textContent = `Ready! BLAKE3 initialized with ${THREAD_COUNT} threads.`;
        status.style.color = '#4ade80';

      } catch (err) {
        status.innerHTML = `<span class="error">Init failed: ${err.message}</span>`;
        console.error('BLAKE3 init error:', err);
      }
    }

    // ============================================================
    // HASH FUNCTIONS
    // ============================================================

    /**
     * Hash data with WASM BLAKE3 (parallel)
     * @param {Uint8Array} data - Input bytes
     * @returns {Uint8Array} - 32-byte hash
     */
    function hashBlake3(data) {
      return blake3Module.hash(data);
    }

    /**
     * Hash data with WebCrypto SHA-256
     * @param {Uint8Array} data - Input bytes
     * @returns {Promise<Uint8Array>} - 32-byte hash
     */
    async function hashSha256(data) {
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return new Uint8Array(hashBuffer);
    }

    /**
     * Convert bytes to hex string
     * @param {Uint8Array} bytes
     * @returns {string}
     */
    function toHex(bytes) {
      return Array.from(bytes)
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    /**
     * Format bytes as human-readable size
     * @param {number} bytes
     * @returns {string}
     */
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    // ============================================================
    // BENCHMARK
    // ============================================================

    /**
     * Benchmark both hash functions on a file
     * @param {File} file
     */
    async function benchmarkFile(file) {
      if (!isReady) {
        alert('BLAKE3 not ready yet. Please wait.');
        return;
      }

      const results = document.getElementById('results');
      const status = document.getElementById('status');
      results.style.display = 'grid';
      status.textContent = `Hashing ${file.name} (${formatSize(file.size)})...`;

      // Read file into memory
      const arrayBuffer = await file.arrayBuffer();
      const data = new Uint8Array(arrayBuffer);

      // --- BLAKE3 Benchmark ---
      const blake3Start = performance.now();
      const blake3Hash = hashBlake3(data);
      const blake3Time = performance.now() - blake3Start;
      const blake3Speed = (file.size / 1024 / 1024) / (blake3Time / 1000);

      document.getElementById('blake3-hash').textContent = toHex(blake3Hash);
      document.getElementById('blake3-time').textContent = blake3Time.toFixed(2) + ' ms';
      document.getElementById('blake3-speed').textContent = blake3Speed.toFixed(0) + ' MB/s';

      // --- SHA-256 Benchmark ---
      const sha256Start = performance.now();
      const sha256Hash = await hashSha256(data);
      const sha256Time = performance.now() - sha256Start;
      const sha256Speed = (file.size / 1024 / 1024) / (sha256Time / 1000);

      document.getElementById('sha256-hash').textContent = toHex(sha256Hash);
      document.getElementById('sha256-time').textContent = sha256Time.toFixed(2) + ' ms';
      document.getElementById('sha256-speed').textContent = sha256Speed.toFixed(0) + ' MB/s';

      // Highlight winner
      const blake3Card = document.getElementById('blake3-card');
      const sha256Card = document.getElementById('sha256-card');
      blake3Card.classList.remove('winner');
      sha256Card.classList.remove('winner');

      if (blake3Speed > sha256Speed) {
        blake3Card.classList.add('winner');
        const ratio = (blake3Speed / sha256Speed).toFixed(1);
        status.textContent = `BLAKE3 wins! ${ratio}x faster than SHA-256`;
        status.style.color = '#4ade80';
      } else {
        sha256Card.classList.add('winner');
        const ratio = (sha256Speed / blake3Speed).toFixed(1);
        status.textContent = `SHA-256 wins! ${ratio}x faster than BLAKE3`;
        status.style.color = '#a78bfa';
      }
    }

    // ============================================================
    // EVENT HANDLERS
    // ============================================================

    const fileArea = document.getElementById('file-area');
    const fileInput = document.getElementById('file-input');

    // Click to open file picker (works on mobile)
    fileArea.addEventListener('click', () => fileInput.click());

    // File selected via picker
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) benchmarkFile(e.target.files[0]);
    });

    // Drag and drop
    fileArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileArea.classList.add('dragover');
    });
    fileArea.addEventListener('dragleave', () => {
      fileArea.classList.remove('dragover');
    });
    fileArea.addEventListener('drop', (e) => {
      e.preventDefault();
      fileArea.classList.remove('dragover');
      if (e.dataTransfer.files[0]) benchmarkFile(e.dataTransfer.files[0]);
    });

    // Initialize on page load
    init();
  </script>
</body>
</html>
